[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anr-cli"
version = "0.1.0"
description = "Terminal client for the Android: Netrunner game API"
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0.52,<4", "rich>=13,<15", "typer>=0.12,<1"]

[project.scripts]
anr = "anr_cli.main:main"
