[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anr-v2"
version = "0.1.0"
description = "Android: Netrunner game backend"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=15,<16"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.package-dir]
"" = "src"
content = "content"

[tool.setuptools.packages.find]
where = ["src", "."]
namespaces = false

[tool.ruff]
target-version = "py311"
src = ["src", "clients/cli/src", "."]
extend-exclude = ["assets", "prototypes", "rules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
